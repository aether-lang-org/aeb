name: release

# Cut a GitHub Release for a v0.NNN tag, publishing the BOOTSTRAP PAYLOAD.
#
# What this ships and why it is deliberately small:
#
#   aeb-bootstrap.tar.gz   the ~445 KB self-bootstrapping source payload —
#                          the bash trampoline, tools/*.ae, lib/, and the
#                          AETHER_PIN / AETHER_FETCH files. On a node with
#                          a C compiler and a network this unpacks and
#                          rebuilds aeb's tools on demand (measured: 11 of
#                          27 tools, ~28s, build green).
#   <asset>.sha256         so a node can VERIFY before it runs. Without
#                          this, `curl | tar` is trust-me; with it, it is
#                          verify-then-run, fail-closed. EVERY published
#                          asset gets one — the source tarball AND each
#                          per-platform bundle below.
#
# ALSO shipped: per-platform bundles whose 5 aeb install tools are already
# cross-compiled for the target, for CI nodes without a C toolchain. The
# source tarball above is still the build-anywhere universal path (and the
# only one that covers a platform with no bundle), but the release notes now
# LEAD with the bundle — it's the path most consumers want (no compiler,
# verifiable, install.sh). Neither is dropped; the notes just stop burying
# the compiler-free option below the whole source story. Nine
# targets — linux amd64/arm64 (gnu + static musl), macos amd64/arm64,
# windows amd64/arm64, freebsd amd64 — each as BOTH aeb-<os>-<arch>.zip and
# .tar.gz (so a minimal image with only `tar` needs no `unzip`), each with
# its own .sha256, and each carrying an install.sh (compiler-free
# `make install`). All cross-built from ONE Linux runner via ae's zig
# backend + (freebsd) the aether cross-sysroot release asset. The row is
# fail-safe: a target that fails to cross-build is skipped, and the source
# tarball + the other bundles still publish. Needs aether >= 0.602.0.
#
# Discipline copied from aeo's docs/releasing-aeo.md +
# docs/operations/agent-host-setup.md: one tag -> one immutable asset set
# -> SHA256s retained forever, a companion .sha256 per asset, and a run
# summary printing the table to pin.
#
# A RELEASE IS AN EXPLICIT ACT. You push a tag; this cuts the release.
# Pushing to main does not create one — main just runs CI.
#
# It used to: autotag.yml tagged every push to main with the next
# sequential v0.NNN and chained here via workflow_call, so a release
# existed per commit (v0.276..v0.282 in two working days). That coupled
# "a commit happened" to "a version exists", which is not the same claim
# — and made every notification and every release-page entry cheap enough
# to ignore. autotag.yml is gone; the numbering is yours to choose.
#
# HISTORICAL NOTE, because it will look like a bug otherwise: the
# `on: push: tags:` below was previously ABSENT on purpose, with a comment
# saying it could never fire. That was true THEN and is false NOW, and the
# difference is who pushes the tag. GitHub suppresses workflow triggers for
# pushes made with the default GITHUB_TOKEN (loop prevention), and autotag
# pushed tags with exactly that token — so the trigger would have been
# present-and-dead. A tag pushed by a HUMAN (or any PAT/deploy key) is an
# ordinary push and does trigger. With autotag gone, tags only come from
# people, so the trigger is live again.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)cut a release for'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      # Two ways in, so the ref has two sources:
      #   push:tags        -> github.ref_name is the tag ("v0.281")
      #   workflow_dispatch-> inputs.tag names an existing tag to (re)cut
      # inputs.tag is EMPTY on a tag push, so `|| github.ref_name` picks the
      # right one. Without the fallback, checkout silently takes the default
      # branch and the release would be cut from main rather than the tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          # Fail loudly rather than publishing something named "" or "main".
          # A release cut from the wrong ref is worse than no release: it
          # looks official and ships the wrong bytes.
          case "$TAG" in
            v*) ;;
            *) echo "refusing to release from ref '$TAG' — expected a v* tag"; exit 1 ;;
          esac
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
            || { echo "tag '$TAG' does not exist"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Cutting release for $TAG"

      # The payload is what a cold node needs to rebuild aeb, and nothing
      # else. Excluding itests/ matters: it is 227 MB of fetched upstream
      # projects, none of which a build node needs.
      - name: Stage the bootstrap payload
        id: stage
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # NAMING. Family convention (aeo): <artifact>-<variant>, with the
          # TAG carrying the version — aeo ships aeo-agent-linux-x86_64-static,
          # not aeo-agent-v0.1.7-linux-x86_64. Matching that here.
          #
          # The version was in the name until v0.279 and it read as
          # inconsistent beside GitHub's own auto-attached assets, which use
          # a third convention entirely and CANNOT be renamed or suppressed:
          #   aether-lang-org-aeb-v0.279-0-gf505afd.tar.gz   ("Source code")
          # (verbatim from v0.279, hence the pre-rename org in the name —
          # GitHub derives it from the owner, so today's reads
          # aether-lang-dev-aeb-...; left as-cut so the example stays true)
          # Three schemes on one page invites grabbing the wrong tarball —
          # and the wrong one here is materially wrong: GitHub's is the WHOLE
          # repo (itests/, the 7.3 MB Maven resolver) with NO published sha,
          # versus our 445 KB verified bootstrap payload. "bootstrap" in the
          # name says which is which at a glance.
          STAGE="aeb-bootstrap"
          mkdir -p "$STAGE"

          cp aeb AETHER_PIN AETHER_FETCH Makefile LICENSE README.md "$STAGE/"
          # Stamp the release TAG into the payload so an installed aeb can
          # self-report its version. The payload has no .git, so make install's
          # `git describe` returns "unknown"; without this VERSION file
          # `aeb --version` reported a generic 0.0.0-dev even on a tagged
          # release. make install copies VERSION into AEB_STAMP's `version`
          # field, which aeb-cli prints. Source installs ship no VERSION file
          # and correctly keep 0.0.0-dev+<sha>.
          # (asks/aeb-version-does-not-embed-the-release-tag.md)
          printf '%s' "$TAG" > "$STAGE/VERSION"
          # veto/ + sandbox/ are 4 KB each and the shipped Makefile's
          # `install` target copies BOTH unconditionally. Omitting them made
          # `make install` fail outright on the released payload —
          # `cp: cannot stat 'veto'` → exit 1, and $PREFIX/bin/aeb was never
          # created, so the tarball could be unpacked and run in place but
          # never installed. Found by actually running `make install` from a
          # published tarball (v0.280); the CI verify step below had missed
          # it because it only ever ran aeb IN PLACE.
          cp -r lib tools veto sandbox "$STAGE/"
          # Ship the docs a node operator actually needs on the box.
          mkdir -p "$STAGE/docs"
          cp docs/aeb-host-vm-or-container-setup.md "$STAGE/docs/" || true

          # No prebuilt binaries in the payload: the point is that it
          # rebuilds. A stale binary here would be worse than none.
          find "$STAGE/tools" -type f -perm -u+x ! -name '*.ae' ! -name '*.md' -delete || true

          # Drop the Maven resolver: aeb-resolve.jar is 3.6 MB and its Java
          # source tree another 3.7 MB — 7.3 MB of an otherwise 440 KB payload,
          # for something ONLY lib/maven shells out to. No core tool
          # references it (checked: aeb-main and aeb-link have zero hits), so
          # a node that never builds a Java target never needs it. A Java
          # node fetches the jar separately; making every node carry it to
          # spare that one is the wrong trade.
          rm -f "$STAGE/tools/aeb-resolve.jar"
          rm -rf "$STAGE/tools/resolver"

          tar czf "$STAGE.tar.gz" "$STAGE"
          sha256sum "$STAGE.tar.gz" | tee "$STAGE.tar.gz.sha256"
          echo "asset=$STAGE.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "$STAGE.tar.gz.sha256")" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$STAGE.tar.gz" | cut -f1)" >> "$GITHUB_OUTPUT"

          # Inventory for the release notes, COUNTED FROM THE REAL PAYLOAD
          # rather than written by hand — a hardcoded "27 tools" in prose
          # goes stale the first time someone adds one, and nothing would
          # catch it. `exe` is the one that must stay 0: the whole claim of
          # this payload is that it is source that rebuilds, so a stray
          # binary here is a bug, not a bonus.
          {
            echo "n_tools=$(find "$STAGE/tools" -maxdepth 1 -name '*.ae' | wc -l | tr -d ' ')"
            echo "n_sdk=$(find "$STAGE/lib" -maxdepth 1 -mindepth 1 -type d | wc -l | tr -d ' ')"
            echo "n_exe=$(find "$STAGE" -type f -perm -u+x ! -name '*.ae' ! -name '*.md' ! -name aeb | wc -l | tr -d ' ')"
            echo "unpacked=$(du -sh "$STAGE" | cut -f1)"
            echo "pin=$(grep -v '^#' "$STAGE/AETHER_PIN" | tr -d '[:space:]')"
            echo "fetchver=$(grep -v '^#' "$STAGE/AETHER_FETCH" | tr -d '[:space:]')"
          } >> "$GITHUB_OUTPUT"

      # THIS IS NOT A TEST SUITE, AND MUST NOT BECOME ONE.
      #
      # Cutting a release deliberately runs NO unit tests and NO itests —
      # not tests/run.sh, not presubmit-smoke, none of it. Whether aeb's
      # SDKs, tools and cache wiring work is ci.yml's job on main, answered
      # on this very commit; re-running it at tag time would re-answer a
      # question already answered, and slow every release to do it.
      #
      # What this step checks is the ARTIFACT, which is a different claim
      # and one CI structurally cannot make: the tarball does not exist
      # until the step above builds it. Everything below is about the
      # payload, never about aeb's behaviour —
      #
      #   * does it match what the release notes say it is (no stray
      #     executables under a "source only" description)?
      #   * does the Aether it pins actually exist and compile?
      #   * does THIS tarball bootstrap on a machine with no aeb?
      #   * does the `make install` path the notes document work?
      #
      # The tiny bash.test fixture below is not testing aeb; it is the
      # smallest proof that the unpacked payload reaches a working state.
      # It could as well be `aeb --list`.
      #
      # Three real bugs shipped or nearly shipped through this gap, all of
      # them invisible to a green main:
      #   * --strip-components flattened bin/ (caught by the compile probe)
      #   * veto/ + sandbox/ missing from staging broke `make install` —
      #     SHIPPED in v0.280, because verify only ran aeb in place
      #   * the cold-bootstrap bug fixed in cc51d92: the trampoline built
      #     aeb-main with no --lib and 2>/dev/null, so it died with E0301
      #     and exited 0 with no output
      #
      # A release whose payload cannot bootstrap is worse than no release:
      # it looks official and fails on the user's node.
      - name: Verify the payload actually bootstraps
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          WORK="$(mktemp -d)"
          tar xzf "aeb-bootstrap.tar.gz" -C "$WORK"
          HOME_DIR="$WORK/aeb-bootstrap"

          test ! -x "$HOME_DIR/tools/aeb-main" \
            || { echo "payload contains a prebuilt aeb-main; it must rebuild"; exit 1; }

          # The release notes state "source only — 0 executables". Assert it
          # rather than trust the staging step's `find -delete`, because the
          # notes are a promise to whoever downloads this: a shipped binary
          # under a source-only description is the kind of mismatch that
          # erodes trust in every other claim on the page. (The bash
          # trampoline `aeb` is the one intended executable and is excluded.)
          STRAY="$(find "$HOME_DIR" -type f -perm -u+x ! -name '*.ae' ! -name '*.md' ! -name aeb)"
          test -z "$STRAY" || {
            echo "payload contains executables but is described as source-only:"
            echo "$STRAY"; exit 1; }

          # Fetch the Aether the payload itself asks for, the same way a
          # cold node would: the trampoline also tries the prebuilt asset
          # first. (That was NOT true until 2026-08-01 — this step used the
          # prebuilt while the trampoline shelled out to get.sh and built
          # from source, so this comment described an intent rather than
          # the shipped behaviour. The trampoline now matches, and falls
          # back to a source build where no asset exists, e.g. linux-arm64.)
          FETCH_VER="$(grep -v '^#' "$HOME_DIR/AETHER_FETCH" | tr -d '[:space:]')"
          curl -fsSL -o /tmp/ae.tgz \
            "https://github.com/aether-lang-dev/aether/releases/download/v$FETCH_VER/aether-$FETCH_VER-linux-x86_64.tar.gz"
          # NO --strip-components: the Aether tarball has no top-level
          # wrapper dir, so it extracts bin/ include/ lib/ share/ directly.
          # Stripping a level flattens bin/ae to ./ae and the probe below
          # then fails with "fetched aether cannot compile" — which is what
          # happened on the first CI run. Verified against the real asset.
          mkdir -p /tmp/aeth && tar xzf /tmp/ae.tgz -C /tmp/aeth

          # Probe by COMPILING, not by --version: the banner succeeds on a
          # toolchain whose aetherc is glibc-broken (v0.449.0 needed
          # GLIBC_2.38 and died on Debian 12 while --version worked).
          printf 'main() { println("ok") \n return 0 }\n' > /tmp/probe.ae
          /tmp/aeth/bin/ae run /tmp/probe.ae | grep -q ok \
            || { echo "fetched aether cannot compile"; exit 1; }

          mkdir -p "$WORK/proj/app"
          printf '#!/usr/bin/env bash\necho BOOTSTRAPPED\n' > "$WORK/proj/app/t.sh"
          chmod +x "$WORK/proj/app/t.sh"
          cat > "$WORK/proj/app/.tests.ae" <<'EOF'
          import bldr
          import bash
          aeb(cap) {
              bldr.build() {
                  bash.test() { script("t.sh") }
              }
          }
          EOF

          cd "$WORK/proj"
          AETHER=/tmp/aeth/bin/ae "$HOME_DIR/aeb" app/.tests.ae | tee /tmp/out.txt
          grep -q "1/1 PASS" /tmp/out.txt \
            || { echo "payload did not bootstrap to a green build"; exit 1; }
          echo "cold bootstrap OK: $(grep -c . /tmp/out.txt) lines"

          # --- AND the OTHER way to use it: `make install` ----------------
          #
          # The step above proves the payload runs IN PLACE. That is only
          # half of what the release notes tell people to do, and the half
          # it skipped was broken: the shipped Makefile's install target
          # copies veto/ and sandbox/, which staging did not include, so
          # `make install` died with `cp: cannot stat 'veto'` and never
          # created $PREFIX/bin/aeb. Shipped that way in v0.280 and was
          # only found by hand. So: install to a scratch prefix and run the
          # RESULT, from a directory that is not the payload.
          INST="$WORK/prefix"
          make -C "$HOME_DIR" install PREFIX="$INST" AETHER=/tmp/aeth/bin/ae \
            >/tmp/install.log 2>&1 \
            || { echo "make install FAILED:"; tail -25 /tmp/install.log; exit 1; }

          test -x "$INST/bin/aeb" \
            || { echo "make install produced no $INST/bin/aeb"; exit 1; }

          # Run the installed aeb on a fresh project, from somewhere else
          # entirely — an installed aeb that only works next to its source
          # tree is not installed.
          mkdir -p "$WORK/proj2/app"
          cp "$WORK/proj/app/t.sh" "$WORK/proj2/app/t.sh"
          cp "$WORK/proj/app/.tests.ae" "$WORK/proj2/app/.tests.ae"
          cd "$WORK/proj2"
          AETHER=/tmp/aeth/bin/ae "$INST/bin/aeb" app/.tests.ae | tee /tmp/out2.txt
          grep -q "1/1 PASS" /tmp/out2.txt \
            || { echo "installed aeb did not reach a green build"; exit 1; }
          echo "make install OK: $INST/bin/aeb builds green from an unrelated dir"

      # Published with `gh release create`, NOT softprops/action-gh-release.
      #
      # WHY: that was the only third-party action in this repo, and it ran
      # in the job holding `contents: write` — the exact shape of the
      # tj-actions/changed-files compromise (Mar 2025). A `@v2` tag is
      # MUTABLE: whoever controls that account can change what runs under
      # it, on the run that publishes our artifacts.
      #
      # SHA-pinning would fix the mutability, but `gh` is preinstalled on
      # every runner and authenticates with the same GITHUB_TOKEN, so the
      # dependency buys nothing here. Removing it means: no third-party
      # code in the release path, no allowlist entry needed if the org
      # enables "select non-aether-lang-dev actions", and no pin to keep
      # fresh. The remaining `actions/checkout` is GitHub-owned.
      # OPTIONAL EXTRA ASSETS: per-platform prebuilt aeb bundles.
      #
      # The source tarball above stays the PRIMARY, canonical bootstrap path
      # (compile-on-target, one asset, no version skew). These bundles are a
      # CONVENIENCE additional path: a `curl | unzip` of a ready-to-run aeb for
      # a given OS/arch — the 5 install tools cross-compiled for that target
      # (aeb-main/aeb-link/aeb-graph/affected-targets/gcheckout via zig-cc, all
      # from THIS Linux runner), over the same clean source tree. The other
      # tools stay .ae source and lazy-build on-target via the user's own `ae`
      # (aeb always needs `ae` at build time — the bundle just skips the
      # aeb-self-compile install step). Proven from one Linux box; see the
      # cross-matrix notes in the DSL-rework session / dsl_rework.md.
      #
      # Targets: 9 — linux gnu+musl x amd64/arm64, windows x amd64/arm64, macos
      # x amd64/arm64, freebsd amd64 (mac links libSystem-only, EULA-clean; musl
      # is static, no glibc floor). Needs aether >= 0.602.0: ships libaether.h in
      # the tarball (fetched releases can cross-compile the runtime-linking
      # tools), exposes the -linux-musl targets, and publishes a lean FreeBSD
      # cross sysroot as a release asset (fetched below for the freebsd row).
      # FreeBSD is amd64-only (no aarch64-freebsd base published).
      - name: Build per-platform bundles
        id: bundles
        # NEVER fail the release: bundles are the OPTIONAL extra path. Any
        # problem here (no zig, a target regressing) must leave the source
        # tarball to publish alone, not abort the run. So the step is
        # continue-on-error AND its body traps failures into an empty zip list.
        continue-on-error: true
        env:
          FETCH_VER: ${{ steps.stage.outputs.fetchver }}
        run: |
          set -uo pipefail   # NOT -e: a failed cross-build is handled, not fatal
          emit_empty() { echo "zips=" >> "$GITHUB_OUTPUT"; echo "no bundles: $1"; exit 0; }

          # The fetched ae (from AETHER_FETCH; carries the cross fixes) is at
          # /tmp/aeth/bin/ae from the Verify step on this runner.
          AE=/tmp/aeth/bin/ae
          test -x "$AE" || emit_empty "no fetched ae"

          SRC="aeb-bootstrap"          # the clean staged tree from the Stage step
          test -d "$SRC" || emit_empty "staged source tree missing"

          # aether's cross backend shells out to zig (0.16.0); the release
          # tarball does NOT bundle it, so install the pinned zig here. On
          # failure, publish source-only rather than aborting.
          ZIG_VER=0.16.0
          ZIG_DIR="/tmp/zig-x86_64-linux-$ZIG_VER"
          if [ ! -x "$ZIG_DIR/zig" ]; then
            curl -fsSL "https://ziglang.org/download/$ZIG_VER/zig-x86_64-linux-$ZIG_VER.tar.xz" \
              -o /tmp/zig.tar.xz \
              && tar -xJf /tmp/zig.tar.xz -C /tmp \
              || emit_empty "zig $ZIG_VER download failed"
          fi
          export PATH="$ZIG_DIR:$PATH"
          zig version || emit_empty "zig not runnable"

          mkdir -p bundles

          # FreeBSD needs a cross sysroot (aether >= 0.601 ships a lean ~22MB
          # one as a release asset; zig supplies CRT+libc, this carries the
          # libs the FreeBSD link line names + headers). linux/win/mac/musl need
          # nothing extra. Fetch it once here; the freebsd row exports
          # AETHER_SYSROOT to it. Best-effort: if the fetch fails, FBSD_SYSROOT
          # stays empty and the freebsd row's builds fail → that row skips
          # (fail-safe), the other 8 bundles still ship. Do NOT restructure the
          # extracted tree — it preserves BSD lib/ + usr/lib/ layout + the
          # ../../lib/<name>.so.N symlinks the linker resolves through.
          FBSD_SYSROOT=""
          FBSD_URL="https://github.com/aether-lang-dev/aether/releases/download/v$FETCH_VER/aether-$FETCH_VER-freebsd-x86_64-sysroot.tar.xz"
          if curl -fsSL "$FBSD_URL" -o /tmp/fbsd-sysroot.tar.xz 2>/dev/null; then
            mkdir -p /tmp/fbsd-sr && tar -xJf /tmp/fbsd-sysroot.tar.xz -C /tmp/fbsd-sr 2>/dev/null \
              && FBSD_SYSROOT="$(ls -d /tmp/fbsd-sr/fbsd-sysroot 2>/dev/null || echo /tmp/fbsd-sr)" \
              && echo "freebsd sysroot ready: $FBSD_SYSROOT"
          else
            echo "freebsd sysroot fetch failed ($FBSD_URL) — freebsd bundle will skip"
          fi

          # triple -> asset-name-suffix. FreeBSD is amd64-only (no aarch64 base).
          for row in \
            "x86_64-linux:linux-amd64" \
            "aarch64-linux:linux-arm64" \
            "x86_64-linux-musl:linux-amd64-musl" \
            "aarch64-linux-musl:linux-arm64-musl" \
            "x86_64-windows:windows-amd64" \
            "aarch64-windows:windows-arm64" \
            "x86_64-macos:macos-amd64" \
            "aarch64-macos:macos-arm64" \
            "x86_64-freebsd:freebsd-amd64" \
          ; do
            triple="${row%%:*}"; suffix="${row##*:}"
            # FreeBSD cross-link needs the sysroot; export it for this row only.
            # If the sysroot fetch failed above, AETHER_SYSROOT is empty and the
            # freebsd builds fail → the row skips via the same fail path.
            if [ "$triple" = "x86_64-freebsd" ]; then
              export AETHER_SYSROOT="$FBSD_SYSROOT"
            else
              unset AETHER_SYSROOT
            fi
            B="bundles/aeb-$suffix"
            rm -rf "$B"; mkdir -p "$B/share/aeb" "$B/bin"
            # clean source tree (bash wrappers + lib/ + tools/ .ae source)
            cp -R "$SRC"/. "$B/share/aeb/"
            cp -f "$SRC/aeb" "$B/bin/aeb"; chmod +x "$B/bin/aeb" "$B/share/aeb/aeb"
            # overwrite the 5 install tools with target-native binaries
            fail=0
            for t in aeb-main aeb-link aeb-graph affected-targets gcheckout; do
              extra=""; [ "$t" = aeb-main ] && extra="--lib $SRC/lib"
              if ! "$AE" build --target="$triple" "$SRC/tools/$t.ae" \
                     -o "$B/share/aeb/tools/$t" --lib "$SRC/tools" $extra >/tmp/b_$t.log 2>&1; then
                echo "  $suffix: $t cross-build FAILED"; sed -n '1,5p' /tmp/b_$t.log; fail=1
              fi
            done
            if [ "$fail" = 0 ]; then
              # Drop a tiny installer so the compiler-free path is self-
              # documenting (ask 3): the extracted tree runs from bin/aeb but
              # warns it is "un-installed"; the stamped install is
              # `make -C share/aeb install PREFIX=…`.
              # Heredoc body is indented to the run-block scalar level (10
              # spaces): YAML strips that common indent before the shell sees
              # it, so the written file is flush-left. A column-1 body would
              # terminate the block scalar early and corrupt the workflow.
              cat > "$B/install.sh" <<'INSTALL'
          #!/bin/sh
          # Install this prebuilt aeb bundle. No compiler needed — the tools
          # under share/aeb/tools are already target-native binaries; bin/aeb
          # is a script. Usage: ./install.sh [PREFIX]   (default: ~/.local)
          set -eu
          here="$(cd "$(dirname "$0")" && pwd)"
          PREFIX="${1:-$HOME/.local}"
          make -C "$here/share/aeb" install PREFIX="$PREFIX"
          echo "aeb installed to $PREFIX/bin/aeb"
          INSTALL
              chmod +x "$B/install.sh"
              # Both archive forms (ask 2): .zip AND .tar.gz, so a minimal CI
              # image with only `tar` (no `unzip`) can consume the fast path.
              ( cd bundles && zip -qr "aeb-$suffix.zip" "aeb-$suffix" )
              ( cd bundles && tar -czf "aeb-$suffix.tar.gz" "aeb-$suffix" )
              # A companion .sha256 for EVERY platform asset (ask 1): the
              # compiler-free fetch path must be verifiable, same as bootstrap.
              ( cd bundles && sha256sum "aeb-$suffix.zip"    > "aeb-$suffix.zip.sha256" )
              ( cd bundles && sha256sum "aeb-$suffix.tar.gz" > "aeb-$suffix.tar.gz.sha256" )
              echo "  ✅ aeb-$suffix.{zip,tar.gz} (+ .sha256 each) ($(du -h bundles/aeb-$suffix.zip | cut -f1) / $(du -h bundles/aeb-$suffix.tar.gz | cut -f1))"
            else
              echo "  ⚠️  aeb-$suffix skipped (a tool failed to cross-build)"
            fi
          done
          # Space-joined list of ALL built platform assets (archives + their
          # .sha256 companions) for the Publish step.
          assets=$(ls bundles/aeb-*.zip bundles/aeb-*.tar.gz bundles/aeb-*.sha256 2>/dev/null | tr '\n' ' ')
          echo "zips=$assets" >> "$GITHUB_OUTPUT"
          echo "built: $assets"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA256: ${{ steps.stage.outputs.sha256 }}
          BUNDLE_ZIPS: ${{ steps.bundles.outputs.zips }}
          # EVERY variable the notes heredoc interpolates must be listed
          # here. The step runs under `set -u`, so one missing name aborts
          # it before `gh` is ever invoked — which shows up as a Publish
          # failure with NO gh output at all, easy to misread as an auth or
          # API problem. (Exactly that: the inventory vars below were added
          # to the notes without being wired in, and v0.281 tagged but
          # never published.)
          ASSET: ${{ steps.stage.outputs.asset }}
          SIZE: ${{ steps.stage.outputs.size }}
          N_TOOLS: ${{ steps.stage.outputs.n_tools }}
          N_SDK: ${{ steps.stage.outputs.n_sdk }}
          N_EXE: ${{ steps.stage.outputs.n_exe }}
          UNPACKED: ${{ steps.stage.outputs.unpacked }}
          PIN: ${{ steps.stage.outputs.pin }}
          FETCHVER: ${{ steps.stage.outputs.fetchver }}
        run: |
          set -euo pipefail
          # ASSET comes from the stage step's output (see env: above), so
          # the name is defined in exactly one place rather than repeated
          # here and drifting from what was actually staged.
          test -f "$ASSET" && test -f "$ASSET.sha256"

          cat > /tmp/notes.md <<EOF
          ## Download this

          Two ways to get aeb. Pick by what's on your box:

          - **No C compiler / a CI node** → grab your **platform bundle**
            below. The aeb tools come **already compiled** for your target;
            nothing to build.
          - **Have a C toolchain, or want the build-anywhere source** →
            **[\`aeb-bootstrap.tar.gz\`](../../releases/download/$TAG/$ASSET)**,
            the self-building source payload (see *Build from source* below).

          Both paths are checksummed and installed the same way in the end
          (\`bin/aeb\` on your \`PATH\`, runtime under \`share/aeb/\`).

          ### Platform bundle (prebuilt, compiler-free)

          A per-platform bundle whose 5 aeb tools are already cross-compiled
          for that target (\`bin/aeb\` stays a script). Nine targets — linux
          amd64/arm64 (gnu + \`-musl\` static, floor-free "any Linux"), macos
          amd64/arm64, windows amd64/arm64, freebsd-amd64 — each as **both**
          \`.zip\` **and** \`.tar.gz\` (so a minimal image with only \`tar\`
          needs no \`unzip\`), and **each with its own \`.sha256\`**.

          \`\`\`bash
          BASE=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG
          A=aeb-linux-amd64.tar.gz              # pick your {os}-{arch}
          curl -fsSL -O \$BASE/\$A -O \$BASE/\$A.sha256
          sha256sum -c \$A.sha256               # fail-closed
          tar xzf \$A                           # -> ./aeb-linux-amd64/
          ./aeb-linux-amd64/install.sh          # no compiler; PREFIX=~/.local
          # or run in place: ./aeb-linux-amd64/bin/aeb --version
          \`\`\`

          The bundled \`install.sh\` runs \`make -C share/aeb install\`
          (compiler-free — the tools are prebuilt) and stamps the install so
          \`bin/aeb\` stops warning it is an un-installed tree. No \`ae\`
          required to install (building *Aether* programs later still needs
          your own \`ae\` on \`PATH\` — see the two-Aethers note below).

          > Ignore GitHub's auto-attached *Source code* assets at the very
          > bottom. Those are the **whole repository** — including
          > \`itests/\` (hundreds of MB of fetched upstream projects) and the
          > 7.3 MB Maven resolver — and carry **no published checksum**.

          ---

          ## Build from source

          If your platform isn't in the bundle list, or you'd rather build
          from source, use **\`aeb-bootstrap.tar.gz\`** ($SIZE) — plus
          \`$ASSET.sha256\` to verify it. This is the universal path: one
          tarball, every platform, nothing compiled ahead of time.

          ### What's inside

          **Source only. There are no executables in this tarball** — not
          for Linux, not for any platform. Nothing here is compiled ahead of
          time; the payload *builds itself* on first use (see below).

          | | |
          |---|---|
          | \`aeb\` | the entry point — a bash script, not a binary |
          | \`tools/*.ae\` | $N_TOOLS Aether **sources** for aeb's own tools |
          | \`lib/\` | $N_SDK SDK modules (the \`import java\`, \`import rust\`, … you write against) |
          | \`AETHER_PIN\` / \`AETHER_FETCH\` | which Aether this release needs ($PIN floor, $FETCHVER fetched) |
          | \`Makefile\`, \`LICENSE\`, \`README.md\`, \`docs/\` | the usual |
          | **prebuilt binaries** | **$N_EXE** |

          $SIZE compressed, ~$UNPACKED unpacked. One tarball works on every
          platform because there is nothing platform-specific in it — the
          same reason the platform bundles above are the *only* place
          per-target binaries live.

          ### What you need on the box

          - **a C compiler and \`make\`** — aeb compiles through C
          - **\`curl\`** and network access on first run
          - **\`ae\` is NOT required** to install aeb. It fetches its own
            pinned Aether into \`~/.cache/aeb/toolchain/\`, private, **never
            on \`PATH\`** — your own \`ae\`, if you have one, is untouched.

          > **But building *Aether* programs does need your own \`ae\`.**
          > aeb's private copy compiles aeb's own machinery only. A target
          > using \`aether.program()\` shells out to the \`ae\` on your
          > \`PATH\`, and fails with \`sh: ae: not found\` if there isn't
          > one. Targets in other languages (\`bash.test\`, \`java\`,
          > \`rust\`, …) have no such requirement. Two Aethers, on purpose —
          > see \`docs/aeb-host-vm-or-container-setup.md\`.

          ### Download and verify

          \`\`\`bash
          TAG=$TAG
          BASE=https://github.com/$GITHUB_REPOSITORY/releases/download/\$TAG

          curl -fsSL -O \$BASE/$ASSET
          curl -fsSL -O \$BASE/$ASSET.sha256
          sha256sum -c $ASSET.sha256      # fail-closed; stop here if it fails
          tar xzf $ASSET                  # -> ./aeb-bootstrap/
          \`\`\`

          The published \`.sha256\` is a standard \`sha256sum\` file, so
          \`-c\` checks it directly — no need to paste the hash by hand.

          ### Then what — two ways to use it

          You now have a directory of **sources**. Pick one:

          **A. Install it** (recommended for a workstation or a long-lived
          build node). Per-user, into \`~/.local\` — **no \`sudo\`**:

          \`\`\`bash
          cd aeb-bootstrap
          make install                    # PREFIX defaults to ~/.local
          # or: make install PREFIX=/opt/aeb

          export PATH="\$HOME/.local/bin:\$PATH"   # if it isn't already
          aeb --version
          \`\`\`

          This compiles the tools and copies the runtime tree to
          \`\$PREFIX/share/aeb/\`, leaving \`\$PREFIX/bin/aeb\` on your
          \`PATH\`. **After that the unpacked directory can be deleted** —
          the install does not point back at it.

          > Do **not** \`sudo make install\`. The prefix is per-user, so it
          > is never needed, and doing it once leaves root-owned binaries in
          > the unpacked tree that later non-root runs cannot overwrite.

          **B. Run it in place** (throwaway containers, CI steps, trying it
          out). No install step — the tarball *is* the installation:

          \`\`\`bash
          ./aeb-bootstrap/aeb --version
          ./aeb-bootstrap/aeb path/to/.build.ae
          \`\`\`

          Keep the directory: this mode runs out of wherever you unpacked
          it. Put it somewhere durable (\`/opt\`, \`/srv\`) rather than
          \`~/Downloads\`.

          **First run takes a minute or two** either way: it fetches the
          pinned Aether and compiles the aeb tools it needs (only those —
          the rest stay unbuilt until something invokes them). Later runs
          are silent and immediate.

          ## Verified in CI

          Not merely uploaded. Before publishing, the source tarball was
          unpacked on a clean runner, fetched the Aether it pins, probed
          that toolchain by **compiling** (not \`--version\` — a banner can
          succeed on an \`aetherc\` that is glibc-broken), and rebuilt aeb
          to a **green build**. The source-only claim above is asserted in
          CI too, not just written here. The platform bundles are
          cross-compiled in the same run and skipped fail-safe if a target
          can't build — so a published bundle is one that actually linked.

          | asset | sha256 |
          |---|---|
          | \`$ASSET\` | \`$SHA256\` |
          EOF

          # --clobber so a re-cut of the same tag replaces assets rather
          # than failing half-published.
          # The source tarball + its sha are the primary assets; the
          # per-platform bundles ($BUNDLE_ZIPS, may be empty) are appended as
          # the optional convenience path. Unquoted on purpose — a
          # space-separated list of paths, each an existing file from the
          # bundles step (empty = source-only, unchanged behaviour).
          gh release create "$TAG" \
            --title "aeb $TAG" \
            --notes-file /tmp/notes.md \
            --repo "$GITHUB_REPOSITORY" \
            "$ASSET" "$ASSET.sha256" $BUNDLE_ZIPS \
          || gh release upload "$TAG" "$ASSET" "$ASSET.sha256" $BUNDLE_ZIPS \
               --repo "$GITHUB_REPOSITORY" --clobber

      - name: Summary
        run: |
          {
            echo "## Release ${{ steps.tag.outputs.tag }}"
            echo
            echo "| asset | sha256 | size |"
            echo "|---|---|---|"
            echo "| \`${{ steps.stage.outputs.asset }}\` | \`${{ steps.stage.outputs.sha256 }}\` | ${{ steps.stage.outputs.size }} |"
          } >> "$GITHUB_STEP_SUMMARY"
